<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>flags-2-env browser contract</title>
    <link rel="stylesheet" href="/site/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">WebAssembly contract</p>
        <h1>flags-2-env in the browser</h1>
        <p>
          This page runs the native C parser through a self-contained WebAssembly module. It sends no
          configuration or arguments over the network.
        </p>
      </header>

      <form id="contract-form">
        <section aria-labelledby="contract-heading">
          <h2 id="contract-heading">Contract</h2>
          <label for="contract">.cli-flags.toml</label>
          <textarea id="contract" name="contract" rows="16" spellcheck="false"></textarea>
        </section>

        <section aria-labelledby="input-heading">
          <h2 id="input-heading">Invocation</h2>
          <label for="argv">argv as JSON</label>
          <input id="argv" name="argv" type="text" autocomplete="off" spellcheck="false" />

          <label for="values">Environment values as JSON</label>
          <input id="values" name="values" type="text" autocomplete="off" spellcheck="false" />

          <div class="actions" role="group" aria-label="Browser client operations">
            <button type="button" data-operation="structured">Structured parse</button>
            <button type="button" data-operation="audit">Audit</button>
            <button type="button" data-operation="help">Help</button>
            <button type="button" data-operation="coerce">Coerce</button>
          </div>
        </section>
      </form>

      <section aria-labelledby="result-heading" class="result-panel">
        <div class="result-heading-row">
          <h2 id="result-heading">Result</h2>
          <output id="status" role="status" aria-live="polite">Ready</output>
        </div>
        <pre id="result" tabindex="0"></pre>
      </section>
    </main>
    <script type="module" src="/site/app.mjs"></script>
  </body>
</html>
