[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flags2env"
version = "0.1.0"
description = "Python bindings for flags2env."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ORESoftware" }]

[tool.setuptools]
py-modules = ["flags2env", "lib"]
include-package-data = true
