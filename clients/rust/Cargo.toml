[package]
name = "flags2env"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust bindings for flags2env."
repository = "https://github.com/ORESoftware/flags-2-env"
readme = "README.md"
build = "build.rs"
include = [
  "LICENSE",
  "README.md",
  "build.rs",
  "native/**",
  "src/**",
  "tests/**",
  "Cargo.toml"
]

[dependencies]
libloading = "0.8"
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
