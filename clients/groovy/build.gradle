plugins {
  id 'java-library'
  id 'groovy'
  id 'maven-publish'
  id 'signing'
}

group = 'com.oresoftware'
version = '0.1.0'

dependencies {
  implementation localGroovy()
  api 'com.oresoftware:flags2env:0.1.0'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(11)
  }
  withSourcesJar()
  withJavadocJar()
}

tasks.withType(Jar).configureEach {
  exclude '**/*Test*'
  exclude 'Dockerfile'
  exclude 'publish.sh'
}

publishing {
  repositories {
    maven {
      name = 'ossrhStagingApi'
      def releasesRepo = uri(System.getenv('CENTRAL_OSSRH_DEPLOY_URL') ?: 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
      def snapshotsRepo = uri(System.getenv('CENTRAL_SNAPSHOT_URL') ?: 'https://central.sonatype.com/repository/maven-snapshots/')
      url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepo : releasesRepo
      credentials {
        username = System.getenv('CENTRAL_TOKEN_USERNAME') ?: System.getenv('SONATYPE_USERNAME') ?: ''
        password = System.getenv('CENTRAL_TOKEN_PASSWORD') ?: System.getenv('SONATYPE_PASSWORD') ?: ''
      }
    }
  }
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifactId = 'flags2env-groovy'
      pom {
        name = 'flags2env Groovy'
        description = 'Groovy facade for the flags2env Java native bridge.'
        url = 'https://github.com/ORESoftware/flags-2-env'
        licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
        developers { developer { id = 'oresoftware'; name = 'ORESoftware' } }
        scm { url = 'https://github.com/ORESoftware/flags-2-env' }
      }
    }
  }
}

signing {
  required { project.hasProperty('release') }
  sign publishing.publications.mavenJava
}
