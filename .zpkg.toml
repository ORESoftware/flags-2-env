[package]
org = "oresoftware"
name = "flags-2-env"
version = "0.1.0"
description = "Portable nested CLI flag-to-environment parser and polyglot bindings"
license = "MIT"
keywords = ["cli", "flags", "environment", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/flags-2-env"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/scripts/verify-shell-contract.py\" --cli \"$ZED_PKG_TEST_TARGET/build/flags2env\" --contract \"$ZED_PKG_TEST_TARGET/.cli-flags.toml\" --command flags2env --install"
exclude = [
  ".build/**",
  "clients/**/.dart_tool/**",
  "clients/**/.gradle/**",
  "clients/**/.zig-cache/**",
  "clients/**/_build/**",
  "clients/**/build/**",
  "clients/**/target/**",
]

[build]
command = "make cli"
outputs = [
  "build/flags2env",
  "scripts/verify-shell-contract.py",
  ".cli-flags.toml",
]

[bin]
flags2env = "build/flags2env"

[scripts]
test = "make test"
