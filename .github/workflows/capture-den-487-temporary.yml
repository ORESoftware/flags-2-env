name: Capture DEN-487 validation (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-487-reusable-compliance' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Capture workflow and policy diagnostics
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color=never \
            .github/workflows/reusable-consumer-compliance.yml \
            .github/workflows/compliance-tooling.yml \
            > .den-487-validation.txt 2>&1
          actionlint_status=$?
          python3 -m py_compile scripts/verify-consumer-compliance.py >> .den-487-validation.txt 2>&1
          compile_status=$?
          bash tests/compliance/run.sh >> .den-487-validation.txt 2>&1
          fixture_status=$?
          printf '\nactionlint_status=%s\ncompile_status=%s\nfixture_status=%s\n' \
            "$actionlint_status" "$compile_status" "$fixture_status" >> .den-487-validation.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-487-validation.txt
          git commit -m 'chore: capture reusable compliance diagnostics'
          git push origin HEAD:feat/den-487-reusable-compliance
