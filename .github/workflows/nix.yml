name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Makefile
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - clients/nodejs/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Makefile
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - clients/nodejs/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Nix formatting
        run: nix develop -c nixfmt --check flake.nix .nix/dev-shell.nix

      - name: Lint the agent shell
        run: nix develop -c shellcheck .nix/agent-check.sh

      - name: Check agent shell formatting
        run: nix develop -c shfmt -i 2 -ci -d .nix/agent-check.sh

      - name: Check GitHub Actions
        run: nix develop -c actionlint .github/workflows/nix.yml

      - name: Evaluate and build flake checks
        run: nix flake check --show-trace

      - name: Install Node dependencies
        run: nix develop -c agent-check dependencies

      - name: Build C and Node artifacts
        run: nix develop -c agent-check build

      - name: Run borrow checker
        run: nix develop -c agent-check borrow

      - name: Verify Node and C README snippets
        run: nix develop -c agent-check readme-core

      - name: Verify Python README adapter
        run: nix develop -c agent-check readme-python

      - name: Verify Ruby README adapter
        run: nix develop -c agent-check readme-ruby

      - name: Verify CLI parity
        run: nix develop -c agent-check parity

      - name: Build native test binaries
        run: nix develop -c agent-check native-build

      - name: Run API hardening tests
        run: nix develop -c agent-check api-hardening

      - name: Run allocation failure tests
        run: nix develop -c agent-check allocation-failure

      - name: Run process smoke tests
        run: nix develop -c agent-check process-smoke

      - name: Audit package and release outputs
        run: nix develop -c agent-check package

  shell-suite-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      diagnostics: ${{ steps.diagnostics.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare shell-suite artifacts
        run: |
          nix develop -c agent-check dependencies
          nix develop -c agent-check build

      - name: Locate failing shell-suite assertion
        id: diagnostics
        run: |
          line="$(nix develop -c agent-check shell-tests-line | tail -n 1)"
          case "$line" in
            0|[0-9]*)
              ;;
            *)
              line=unknown
              ;;
          esac
          printf 'matrix={"include":[{"line":"%s"}]}\n' "$line" >>"$GITHUB_OUTPUT"

  shell-suite-diagnostics:
    needs: shell-suite-scan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.shell-suite-scan.outputs.diagnostics) }}
    name: Shell suite assertion at tests/run.sh:${{ matrix.line }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce shell-suite result
        env:
          FAILURE_LINE: ${{ matrix.line }}
        run: |
          if [ "$FAILURE_LINE" != 0 ]; then
            exit 1
          fi
