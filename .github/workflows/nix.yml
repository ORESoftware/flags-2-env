name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Makefile
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - tools/borrow-checker/**
      - clients/nodejs/**
      - clients/python/**
      - clients/ruby/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - Makefile
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - scripts/**
      - tools/borrow-checker/**
      - clients/nodejs/**
      - clients/python/**
      - clients/ruby/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Nix formatting
        run: nix develop -c nixfmt --check flake.nix .nix/dev-shell.nix

      - name: Lint the agent shell
        run: nix develop -c shellcheck .nix/agent-check.sh

      - name: Check agent shell formatting
        run: nix develop -c shfmt -i 2 -ci -d .nix/agent-check.sh

      - name: Check GitHub Actions
        run: nix develop -c actionlint .github/workflows/nix.yml

      - name: Evaluate and build flake checks
        run: nix flake check --show-trace

      - name: Install Node dependencies
        run: nix develop -c agent-check dependencies

      - name: Build C and Node artifacts
        run: nix develop -c agent-check build

      - name: Run borrow checker
        run: nix develop -c agent-check borrow

      - name: Verify Node and C README snippets
        run: nix develop -c agent-check readme-core

      - name: Verify Python README adapter
        run: nix develop -c agent-check readme-python

      - name: Verify Ruby README adapter
        run: nix develop -c agent-check readme-ruby

      - name: Verify CLI parity
        run: nix develop -c agent-check parity

      - name: Build native test binaries
        run: nix develop -c agent-check native-build

      - name: Run shell and CLI suite
        run: nix develop -c agent-check shell-tests

      - name: Run API hardening tests
        run: nix develop -c agent-check api-hardening

      - name: Run allocation failure tests
        run: nix develop -c agent-check allocation-failure

      - name: Run process smoke tests
        run: nix develop -c agent-check process-smoke

      - name: Audit package and release outputs
        run: nix develop -c agent-check package

      - name: Prove the default agent command
        run: nix develop -c agent-check

  shell-suite-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      diagnostics: ${{ steps.diagnostics.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Capture shell-suite diagnostic
        id: diagnostics
        run: |
          set +e
          nix develop -c agent-check dependencies >/dev/null
          nix develop -c agent-check build >/dev/null
          nix develop -c agent-check shell-tests >shell-suite.stdout 2>shell-suite.stderr
          status=$?
          set -e
          STATUS="$status" python3 - <<'PY' >matrix.json
          import json
          import os
          import re

          status = int(os.environ["STATUS"])
          lines = []
          for path in ("shell-suite.stderr", "shell-suite.stdout"):
              try:
                  with open(path, encoding="utf-8", errors="replace") as stream:
                      lines.extend(line.strip() for line in stream if line.strip())
              except OSError:
                  pass
          lines = [
              line for line in lines
              if not line.startswith("shell suite failed")
              and not line.startswith("__F2E_FAILURE_LINE__")
              and not line.startswith("==> agent-check stage:")
          ]
          message = lines[-1] if lines else "clean" if status == 0 else "no-diagnostic-output"
          message = re.sub(r"[^A-Za-z0-9._+/:=-]+", "-", message).strip("-")[:100]
          print(json.dumps({"include": [{"status": status, "message": message or "empty"}]}, separators=(",", ":")))
          PY
          printf 'matrix=%s\n' "$(cat matrix.json)" >>"$GITHUB_OUTPUT"

      - name: Upload shell-suite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shell-suite-diagnostics
          path: |
            shell-suite.stdout
            shell-suite.stderr
          retention-days: 1
          if-no-files-found: warn

  shell-suite-diagnostics:
    needs: shell-suite-scan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.shell-suite-scan.outputs.diagnostics) }}
    name: Shell suite exit ${{ matrix.status }} — ${{ matrix.message }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce shell-suite result
        env:
          FAILURE_STATUS: ${{ matrix.status }}
        run: test "$FAILURE_STATUS" -eq 0
