name: Apply DEN-442 multiline arrays (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-442-multiline-toml-arrays' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply parser and correct semantic test cases once
        shell: bash
        run: |
          if ! grep -q 'F2E_MAX_LOGICAL_LINE' src/parser.c; then
            python3 scripts/apply_den_442.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/run.sh')
          text = path.read_text()
          text = text.replace(
              '--operation-mode fast --without-color',
              '--operation-mode fast --color=without-color',
          )
          text = text.replace(
              '--destination production --yes-color',
              '--destination production --color=yes-color',
          )
          path.write_text(text)
          PY
      - name: Capture parser and packaging validation
        shell: bash
        run: |
          set +e
          {
            make clean all
            make borrow-check parity-test build/process-smoke build/api-hardening build/allocation-failure
            ./tests/run.sh
            ./build/api-hardening
            ./build/allocation-failure tests/subcommands-deep/.cli-flags.toml
            ./build/process-smoke --port 7777 -d
          } > .den-442-validation.txt 2>&1
          test_status=$?
          if [[ "$test_status" -eq 0 ]]; then
            ./scripts/audit-client-packaging.sh >> .den-442-validation.txt 2>&1
            packaging_status=$?
          else
            packaging_status=99
          fi
          printf '\ntest_status=%s\npackaging_status=%s\n' "$test_status" "$packaging_status" >> .den-442-validation.txt
          exit 0
      - name: Commit corrected tests and diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/run.sh .den-442-validation.txt
          git commit -m 'test: validate multiline TOML array semantics'
          git push origin HEAD:feat/den-442-multiline-toml-arrays
