name: Source migration

on:
  pull_request:
    paths:
      - ".cli-flags.toml"
      - ".zpkg.toml"
      - ".github/workflows/source-migration.yml"
      - "README.md"
      - "clients/**"
      - "docs/source-migration.json"
      - "docs/source-migration.md"
      - "docs/source-migration.schema.json"
      - "formal/fmctl.json"
      - "package.json"
      - "packaging/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".cli-flags.toml"
      - ".zpkg.toml"
      - ".github/workflows/source-migration.yml"
      - "README.md"
      - "clients/**"
      - "docs/source-migration.json"
      - "docs/source-migration.md"
      - "docs/source-migration.schema.json"
      - "formal/fmctl.json"
      - "package.json"
      - "packaging/**"
      - "scripts/**"
  # The compatibility window is a dated promise, so it needs a time-based
  # check: on path triggers alone the cutoff can pass unnoticed between commits.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      check_remotes:
        description: Compare canonical and compatibility main/tag object IDs
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/source-migration.yml

      - name: Validate source migration metadata
        run: |
          python3 scripts/verify-source-migration.py
          bash -n scripts/publish-zed-compatibility.sh

      - name: Compare canonical and compatibility refs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_remotes }}
        run: python3 scripts/verify-source-migration.py --check-remotes
