name: Capture bundled Rust clippy (temporary)

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-390-bundled-rust-runtime' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: clippy
      - name: Capture diagnostic
        working-directory: clients/rust
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings > ../../.den-390-clippy.txt 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> ../../.den-390-clippy.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .den-390-clippy.txt
          git commit -m 'chore: capture bundled Rust clippy diagnostic'
          git push origin HEAD:feat/den-390-bundled-rust-runtime
