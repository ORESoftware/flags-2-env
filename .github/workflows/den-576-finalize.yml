name: Finalize DEN-576 terminal-description verifier

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-576-fix-description.py
      - .github/workflows/den-576-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'feat/den-576-consumer-fleet' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the exact verifier fix
        run: python3 scripts/den-576-fix-description.py

      - name: Capture verifier and fleet validation
        shell: bash
        run: |
          set +e
          {
            set -x
            git diff --check
            python3 -m unittest -v \
              tests.test_shell_contract_verifier \
              tests.test_consumer_fleet
            python3 scripts/render-consumer-fleet.py \
              --fleet consumer-fleet.json \
              --print >validation-matrix.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          matrix = json.loads(Path('validation-matrix.json').read_text())
          print(f"matrix entries: {len(matrix['include'])}")
          assert len(matrix['include']) == 23
          PY
          } >validation.log 2>&1
          status=$?
          printf '%s\n' "$status" >validation.status
          cat validation.log
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: den-576-validation
          path: |
            validation.log
            validation.status
            validation-matrix.json
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce validation result
        run: test "$(cat validation.status)" = 0

      - name: Commit the reviewable verifier fix
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-shell-contract.py tests/test_shell_contract_verifier.py
          git commit -m 'fix(DEN-576): tolerate terminal punctuation wrapping in descriptions'
          git push origin "HEAD:$HEAD_BRANCH"
