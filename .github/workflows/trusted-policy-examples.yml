name: trusted-policy-examples

on:
  pull_request:
    paths:
      - "clients/rust/README.md"
      - "docs/trusted-policy-paths.md"
      - "tests/fixtures/rust-git-consumer/src/main.rs"
      - "tests/trusted_policy_examples.rs"
      - ".github/workflows/trusted-policy-examples.yml"
  push:
    branches: [main]
    paths:
      - "clients/rust/README.md"
      - "docs/trusted-policy-paths.md"
      - "tests/fixtures/rust-git-consumer/src/main.rs"
      - "tests/trusted_policy_examples.rs"
      - ".github/workflows/trusted-policy-examples.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute dependency-independent policy guards
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test tests/trusted_policy_examples.rs -o "$RUNNER_TEMP/trusted-policy-examples"
          "$RUNNER_TEMP/trusted-policy-examples" --nocapture
