name: CLI Flags Audit

on:
  pull_request:
    paths:
      - ".github/workflows/cli-flags-audit.yml"
      - "scripts/audit-changed-cli-flags.sh"
      - ".cli-flags.toml"
      - "**/.cli-flags.toml"
      - ".env"
      - "**/.env"
  push:
    paths:
      - ".github/workflows/cli-flags-audit.yml"
      - "scripts/audit-changed-cli-flags.sh"
      - ".cli-flags.toml"
      - "**/.cli-flags.toml"
      - ".env"
      - "**/.env"

permissions:
  contents: read

concurrency:
  group: cli-flags-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build audit CLI
        run: make clean && make all

      - name: Audit changed flag configs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/audit-changed-cli-flags.sh
