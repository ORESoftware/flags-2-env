name: One-shot packaging baseline repair

on:
  push:
    branches:
      - agent/den-2917-packaging-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout packaging repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Synchronize canonical parser copies and unpin generated Node tarball
        shell: bash
        run: |
          set -euo pipefail

          for dst in \
            clients/cpp/native/parser.c \
            clients/golang/parser.c \
            clients/java/native/parser.c \
            clients/csharp/native/parser.c \
            clients/fsharp/native/parser.c \
            clients/elixir/native/parser.c \
            clients/erlang/c_src/parser.c \
            clients/r/src/parser.c \
            clients/matlab/native/parser.c \
            clients/fortran/src/parser.c \
            clients/zig/native/parser.c
          do
            cp src/parser.c "$dst"
          done

          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/codegen-docker/Dockerfile')
          text = path.read_text()
          old = '''RUN npm init -y \\
              && npm pkg set type=module \\
              && npm install --no-audit --no-fund \\
                /tmp/oresoftware-f2e-0.1.0.tgz \\
                @types/node@22 \\
                typescript@5
          '''
          new = '''RUN package_tarball="$(find /tmp -maxdepth 1 -type f -name 'oresoftware-f2e-*.tgz' -print -quit)" \\
              && test -n "$package_tarball" \\
              && npm init -y \\
              && npm pkg set type=module \\
              && npm install --no-audit --no-fund \\
                "$package_tarball" \\
                @types/node@22 \\
                typescript@5
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one hard-coded Node tarball install block')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check

      - name: Install the same packaging audit prerequisites as production CI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zsh ruby
          npm ci
          make clean all

      - name: Prove packaging copy contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-client-packaging.sh

      - name: Prove generated Node code package flow
        shell: bash
        run: |
          set -euo pipefail
          bash tests/codegen-docker/run.sh nodejs

      - name: Commit verified baseline repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-packaging-baseline.yml
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair client packaging baseline'
          git push origin HEAD:agent/den-2917-packaging-baseline
