name: DEN-979 finalize tested alias hardening

on:
  push:
    branches:
      - agent/den-979-subcommand-alias-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-979-subcommand-alias-hardening
          fetch-depth: 0

      - name: Detect whether the temporary source transformer remains
        id: state
        shell: bash
        run: |
          if [ -f scripts/den-979-apply.py ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed alias hardening
        if: steps.state.outputs.run == 'true'
        run: |
          python3 scripts/den-979-apply.py
          python3 scripts/den-979-shell-portability.py
          python3 scripts/den-979-test-expectations.py

      - name: Re-run focused parser, API, audit, and completion gates
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          make cli build/api-hardening
          ./tests/run.sh
          ./build/api-hardening

      - name: Publish tested non-workflow source changes
        if: steps.state.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- build .github/workflows/shell-contract.yml
          rm -f \
            scripts/den-979-apply.py \
            scripts/den-979-trigger.txt \
            scripts/den-979-shell-portability.py \
            scripts/den-979-test-expectations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(DEN-979): harden canonical subcommand aliases'
          git push origin HEAD:agent/den-979-subcommand-alias-hardening
