name: Repair DEN-2754 patch guard

on:
  push:
    branches:
      - alexanderdmills/den-2754-flags-2-env-env-lines-past-the-read-buffer-are-still

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Correct the over-escaped regex guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-den-2754.yml')
          text = path.read_text()
          old = r"""r'''static int f2e_dotenv_load_one\\(F2EDotEnv \\*dotenv, const F2EConfig \\*config,\\n\\s+const char \\*relative_path\\) \\{'''"""
          new = r"""r'''static int f2e_dotenv_load_one\(F2EDotEnv \*dotenv, const F2EConfig \*config,\n\s+const char \*relative_path\) \{'''"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one over-escaped guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-den-2754-regex.yml
          git config user.name "alex-main-agent"
          git config user.email "alex-main-agent@users.noreply.github.com"
          git add .github/workflows/agent-den-2754.yml .github/workflows/repair-den-2754-regex.yml
          git diff --cached --check
          git commit -m "ci: correct DEN-2754 regex guard"
          git push origin HEAD
