name: Consumer compliance tooling

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-consumer-compliance.yml"
      - ".github/workflows/compliance-tooling.yml"
      - "scripts/verify-consumer-compliance.py"
      - "scripts/verify-vendored-parser.py"
      - "scripts/verify-client-parser-sync.py"
      - "tests/test_client_parser_sync.py"
      - "src/parser.c"
      - "src/parser.h"
      - "clients/**/parser.c"
      - "clients/**/parser.h"
      - "tests/compliance/**"
      - "tests/test_consumer_compliance_policy.py"
      - "tests/test_vendored_parser_identity.py"
      - "docs/consumer-compliance.md"
      - "docs/vendored-parser-identity.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reusable-consumer-compliance.yml"
      - ".github/workflows/compliance-tooling.yml"
      - "scripts/verify-consumer-compliance.py"
      - "scripts/verify-vendored-parser.py"
      - "scripts/verify-client-parser-sync.py"
      - "tests/test_client_parser_sync.py"
      - "src/parser.c"
      - "src/parser.h"
      - "clients/**/parser.c"
      - "clients/**/parser.h"
      - "tests/compliance/**"
      - "tests/test_consumer_compliance_policy.py"
      - "tests/test_vendored_parser_identity.py"
      - "docs/consumer-compliance.md"
      - "docs/vendored-parser-identity.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/reusable-consumer-compliance.yml .github/workflows/compliance-tooling.yml
      - name: Compile policy checkers
        run: |
          python3 -m py_compile \
            scripts/verify-consumer-compliance.py \
            scripts/verify-vendored-parser.py \
            scripts/verify-client-parser-sync.py
      - name: Run policy unit tests
        run: |
          python3 -m unittest \
            tests/test_consumer_compliance_policy.py \
            tests/test_vendored_parser_identity.py \
            tests/test_client_parser_sync.py
      - name: Run end-to-end policy fixtures
        run: bash tests/compliance/run.sh

      # verify-vendored-parser.py checks an external consumer against an
      # immutable parser_ref. This is the same rule turned inward: the copies
      # this repository ships to itself. clients/cpp, clients/golang and the
      # rest compile their own committed parser.c rather than linking src/,
      # so a src/ change that lands without refreshing them leaves two
      # languages parsing by different rules while every argv-level test
      # still passes.
      - name: Verify in-repo vendored parser copies match src/
        run: python3 scripts/verify-client-parser-sync.py --min-copies 20
