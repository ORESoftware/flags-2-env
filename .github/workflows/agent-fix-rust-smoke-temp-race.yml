name: One-shot Rust smoke temp race repair

on:
  push:
    branches:
      - agent/den-2927-rust-smoke-temp-race

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Make Rust smoke temp allocations unique per call
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('clients/rust/tests/smoke.rs')
          text = path.read_text()

          old_import = 'use std::process::Command;\n'
          new_import = 'use std::process::Command;\nuse std::sync::atomic::{AtomicU64, Ordering};\n\nstatic TEMP_SEQUENCE: AtomicU64 = AtomicU64::new(0);\n'
          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one Command import anchor')
          text = text.replace(old_import, new_import, 1)

          old_temp = '''fn temp_dir(label: &str) -> PathBuf {
              let path = env::temp_dir().join(format!("flags2env-rust-{label}-{}", std::process::id()));
              let _ = fs::remove_dir_all(&path);
              fs::create_dir_all(&path).unwrap();
              path
          }
          '''
          new_temp = '''fn temp_dir(label: &str) -> PathBuf {
              let sequence = TEMP_SEQUENCE.fetch_add(1, Ordering::Relaxed);
              let path = env::temp_dir().join(format!(
                  "flags2env-rust-{label}-{}-{sequence}",
                  std::process::id()
              ));
              let _ = fs::remove_dir_all(&path);
              fs::create_dir_all(&path).unwrap();
              path
          }
          '''
          if text.count(old_temp) != 1:
              raise SystemExit('expected exactly one temp_dir implementation anchor')
          path.write_text(text.replace(old_temp, new_temp, 1))
          PY
          git diff --check

      - name: Repeat Rust smoke test to stress parallel allocations
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5 6 7 8; do
            echo "rust smoke iteration $iteration"
            (cd clients/rust && cargo test --test smoke)
          done

      - name: Run existing isolated Rust Docker smoke
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/docker-check-new-clients.sh --only rust

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-rust-smoke-temp-race.yml
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make Rust smoke temp directories collision-free'
          git push origin HEAD:agent/den-2927-rust-smoke-temp-race
