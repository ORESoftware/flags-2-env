name: One-shot Zed E2E version repair

on:
  push:
    branches:
      - agent/den-2921-zed-e2e-version

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Derive Zed install coordinate from .zpkg.toml
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/flags-2-env-e2e.sh')
          text = path.read_text()

          anchor = '''if [[ ! -f "$repo_root/.zpkg.toml" ]]; then
            echo "could not locate the flags-2-env repository root" >&2
            exit 2
          fi
          '''
          replacement = '''if [[ ! -f "$repo_root/.zpkg.toml" ]]; then
            echo "could not locate the flags-2-env repository root" >&2
            exit 2
          fi

          read -r package_ref package_version < <(
            python3 - "$repo_root/.zpkg.toml" <<'PY_ZPKG'
          import pathlib
          import sys
          import tomllib

          package = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["package"]
          org = package["org"]
          name = package["name"]
          version = package["version"]
          print(f"{org}/{name}@={version} {version}")
          PY_ZPKG
          )
          if [[ -z "$package_ref" || -z "$package_version" ]]; then
            echo "could not derive the exact package coordinate from .zpkg.toml" >&2
            exit 2
          fi
          '''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one repository-root anchor')
          text = text.replace(anchor, replacement, 1)

          old_install = '''      "$zed" install 'oresoftware/flags-2-env@=0.1.0' \\
          '''
          new_install = '''      "$zed" install "$package_ref" \\
          '''
          if text.count(old_install) != 1:
              raise SystemExit('expected exactly one stale exact-version install')
          text = text.replace(old_install, new_install, 1)

          old_lock = '''  grep -Fq 'version = "0.1.0"' "$expected/.zpkg.lock"
          '''
          new_lock = '''  grep -Fq "version = \\\"$package_version\\\"" "$expected/.zpkg.lock"
          '''
          if text.count(old_lock) != 1:
              raise SystemExit('expected exactly one stale lockfile-version assertion')
          text = text.replace(old_lock, new_lock, 1)

          path.write_text(text)
          PY

          git diff --check
          if grep -Fq 'oresoftware/flags-2-env@=0.1.0' tests/flags-2-env-e2e.sh; then
            echo 'stale Zed install version remains' >&2
            exit 1
          fi

      - name: Checkout pinned Zed interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 07d01604461d00e237c7d86ad3855464167574ec
          path: external/zed-interfaces
          persist-credentials: false

      - name: Checkout pinned Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: 8d04bc598a4b0b464466cbec3c44d18cf2922137
          path: external/zed-cli
          persist-credentials: false

      - name: Install Zsh and Rust
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build pinned Zed CLI
        shell: bash
        run: cargo build --locked --manifest-path external/zed-cli/Cargo.toml

      - name: Run the full multi-layout Zed E2E
        shell: bash
        env:
          F2E_E2E_ROOT: ${{ runner.temp }}/flags-2-env-e2e-version-repair
        run: |
          set -euo pipefail
          tests/flags-2-env-e2e.sh "$GITHUB_WORKSPACE/external/zed-cli/target/debug/zed"

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-zed-e2e-version.yml
          rm -rf external
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -A
          git diff --cached --check
          git commit -m 'Derive Zed E2E package version from manifest'
          git push origin HEAD:agent/den-2921-zed-e2e-version
