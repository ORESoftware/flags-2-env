name: One-shot tracked dotenv fixture migration

on:
  push:
    branches:
      - agent/den-2902-flags-dotenv-fixtures

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Migrate committed dotenv fixtures to neutral tracked names
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          fixture_dirs = [
              "tests/dotenv",
              "tests/env-audit",
              "tests/dotenv-order",
              "tests/env-audit-drift",
              "tests/env-audit-clean",
              "tests/env-audit-ignore",
              "tests/dotenv-global-override",
          ]

          for directory in fixture_dirs:
              src = Path(directory) / ".env"
              dst = Path(directory) / "fixture.dotenv"
              if not src.is_file():
                  raise SystemExit(f"expected tracked fixture missing: {src}")
              subprocess.run(["git", "mv", str(src), str(dst)], check=True)

          ignore = Path(".gitignore")
          text = ignore.read_text()
          marker = "# BEGIN ORESoftware plaintext dotenv boundary"
          if marker not in text:
              text = text.rstrip() + "\n\n" + """# BEGIN ORESoftware plaintext dotenv boundary
          # Real plaintext dotenv state is local-only. Parser fixtures use fixture.dotenv.
          *.env
          */*.env
          */**/*.env
          .env.*
          *.env.*
          !.env.example
          # END ORESoftware plaintext dotenv boundary
          """
              ignore.write_text(text)

          run_sh = Path("tests/run.sh")
          run_text = run_sh.read_text()
          old_setup = '''TMP_TEST_DIR="${TMPDIR:-/tmp}/flags2env-tests-$$"
          rm -rf "$TMP_TEST_DIR"
          mkdir -p "$TMP_TEST_DIR"
          trap 'rm -rf "$TMP_TEST_DIR"' EXIT
          '''
          new_setup = '''TMP_TEST_DIR="${TMPDIR:-/tmp}/flags2env-tests-$$"
          rm -rf "$TMP_TEST_DIR"
          mkdir -p "$TMP_TEST_DIR"

          MATERIALIZED_DOTENV_DIRS="
          tests/dotenv
          tests/env-audit
          tests/dotenv-order
          tests/env-audit-drift
          tests/env-audit-clean
          tests/env-audit-ignore
          tests/dotenv-global-override
          "

          cleanup_test_state() {
            rm -rf "$TMP_TEST_DIR"
            for fixture_dir in $MATERIALIZED_DOTENV_DIRS; do
              rm -f "$ROOT_DIR/$fixture_dir/.env"
            done
          }
          trap cleanup_test_state EXIT
          trap 'cleanup_test_state; exit 130' HUP INT TERM

          # The repository never tracks plaintext .env files. Tests that exercise
          # implicit ./.env discovery materialize synthetic fixtures for the
          # duration of the suite and remove them on every normal/catchable exit.
          for fixture_dir in $MATERIALIZED_DOTENV_DIRS; do
            cp "$ROOT_DIR/$fixture_dir/fixture.dotenv" "$ROOT_DIR/$fixture_dir/.env"
          done
          '''
          if old_setup not in run_text:
              raise SystemExit("tests/run.sh setup anchor changed; refusing broad rewrite")
          run_sh.write_text(run_text.replace(old_setup, new_setup, 1))

          helper = Path("scripts/audit-changed-cli-flags.sh")
          helper_text = helper.read_text()
          old_awk = '''  $0 == ".env" {
              print ".cli-flags.toml"
              next
            }
            /\\/\\.env$/ {
              file = $0
              sub(/\\/\\.env$/, "/.cli-flags.toml", file)
              print file
            }
          '''
          new_awk = '''  $0 == ".env" || $0 == "fixture.dotenv" {
              print ".cli-flags.toml"
              next
            }
            /\\/(\\.env|fixture\\.dotenv)$/ {
              file = $0
              sub(/\\/(\\.env|fixture\\.dotenv)$/, "/.cli-flags.toml", file)
              print file
            }
          '''
          if old_awk not in helper_text:
              raise SystemExit("changed-file audit awk anchor changed; refusing broad rewrite")
          helper_text = helper_text.replace(old_awk, new_awk, 1)

          old_env_block = '''  env_path="$(dirname -- "$path")/.env"
            case "$file" in
              .cli-flags.toml) env_file=".env" ;;
              */.cli-flags.toml) env_file="${file%/.cli-flags.toml}/.env" ;;
              *) env_file="$(dirname -- "$file")/.env" ;;
            esac
            if [ ! -f "$env_path" ]; then
              printf 'cli-flags env audit: no adjacent .env for %s\\n' "$file"
              continue
            fi
          '''
          new_env_block = '''  env_path="$(dirname -- "$path")/.env"
            case "$file" in
              .cli-flags.toml) env_file=".env" ;;
              */.cli-flags.toml) env_file="${file%/.cli-flags.toml}/.env" ;;
              *) env_file="$(dirname -- "$file")/.env" ;;
            esac
            if [ ! -f "$env_path" ]; then
              fixture_path="$(dirname -- "$path")/fixture.dotenv"
              case "$file" in
                .cli-flags.toml) fixture_file="fixture.dotenv" ;;
                */.cli-flags.toml) fixture_file="${file%/.cli-flags.toml}/fixture.dotenv" ;;
                *) fixture_file="$(dirname -- "$file")/fixture.dotenv" ;;
              esac
              if [ -f "$fixture_path" ]; then
                env_path="$fixture_path"
                env_file="$fixture_file"
              else
                printf 'cli-flags env audit: no adjacent .env or fixture.dotenv for %s\\n' "$file"
                continue
              fi
            fi
          '''
          if old_env_block not in helper_text:
              raise SystemExit("changed-file audit env anchor changed; refusing broad rewrite")
          helper.write_text(helper_text.replace(old_env_block, new_env_block, 1))
          PY

          git diff --check

      - name: Build and run affected shell suite
        shell: bash
        run: |
          set -euo pipefail
          make clean all
          bash ./.nix/agent-check.sh shell-tests

      - name: Assert plaintext dotenv is no longer tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); raise SystemExit(any(p == b".env" or p.endswith(b"/.env") or p.endswith(b".env") for p in paths if p))'; then
            :
          else
            echo 'tracked plaintext dotenv path remains after fixture migration' >&2
            git ls-files '*env*' >&2 || true
            exit 1
          fi

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-migrate-dotenv-fixtures.yml
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add -A
          git diff --cached --check
          git commit -m 'Migrate tracked dotenv test fixtures'
          git push origin HEAD:agent/den-2902-flags-dotenv-fixtures
