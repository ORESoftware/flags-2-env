name: Browser WebAssembly

on:
  pull_request:
    paths:
      - ".github/workflows/browser.yml"
      - "clients/browser/**"
      - "src/parser.c"
      - "src/parser.h"
      - "tests/browser/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser.yml"
      - "clients/browser/**"
      - "src/parser.c"
      - "src/parser.h"
      - "tests/browser/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-wasm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium against the real C parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Emscripten and Python tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emscripten python3-venv

      - name: Build the WebAssembly client
        run: bash clients/browser/build.sh

      - name: Install pinned Playwright
        run: |
          set -euo pipefail
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.55.0
          .venv-browser/bin/python -m playwright install --with-deps chromium

      - name: Run browser contract
        run: .venv-browser/bin/python tests/browser/test_browser.py

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flags2env-browser-diagnostics
          path: build/browser-results
          if-no-files-found: ignore
          retention-days: 7
