name: Browser WebAssembly

on:
  pull_request:
    paths:
      - ".github/workflows/browser.yml"
      - "clients/browser/**"
      - "src/parser.c"
      - "src/parser.h"
      - "tests/browser/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser.yml"
      - "clients/browser/**"
      - "src/parser.c"
      - "src/parser.h"
      - "tests/browser/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-wasm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }} main thread and worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Test worker lifecycle without browser timing
        run: node --test tests/browser/worker_client_test.mjs

      - name: Install Python tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-venv

      - name: Build with the pinned Emscripten toolchain
        run: |
          set -euo pipefail
          source clients/browser/toolchain.env
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/src" \
            --workdir /src \
            "$F2E_EMSCRIPTEN_IMAGE" \
            bash clients/browser/build.sh

      - name: Install pinned Playwright ${{ matrix.browser }}
        run: |
          set -euo pipefail
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.55.0
          .venv-browser/bin/python -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Run main-thread and worker contracts
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: .venv-browser/bin/python tests/browser/test_cross_browser.py

      - name: Run worker backpressure and lifecycle contract
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: .venv-browser/bin/python tests/browser/test_worker_lifecycle.py

      - name: Upload ${{ matrix.browser }} browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flags2env-${{ matrix.browser }}-browser-diagnostics
          path: build/browser-results
          if-no-files-found: ignore
          retention-days: 7
